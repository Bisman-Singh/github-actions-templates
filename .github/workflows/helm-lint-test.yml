name: Helm Lint & Test

on:
  push:
    paths:
      - "test/helm/**"
  pull_request:
    paths:
      - "test/helm/**"

jobs:
  lint-and-template:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm lint
        run: helm lint test/helm/

      - name: Helm template (default values)
        run: helm template test-release test/helm/

      - name: Helm template (dry-run install)
        run: helm template test-release test/helm/ --values test/helm/values.yaml --debug
